<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atrapa la Moneda - 1° Aniversario</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #202020;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        #gameContainer {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(to bottom, #1a0933, #4a154b, #87ceeb);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: none;
            max-width: 100%;
            max-height: 100%;
        }

        canvas:active {
            cursor: grabbing;
        }

        /* ===== DECORACIÓN DE ANIVERSARIO ===== */
        .anniversary-banner {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #ffd700, #ff69b4, #00ffff, #ffd700);
            background-size: 300% 300%;
            animation: rainbow 4s ease infinite;
            color: #000;
            padding: 6px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
            z-index: 90;
            pointer-events: none;
            text-align: center;
        }

        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .fullscreen-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            z-index: 99;
        }

        .fullscreen-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .shop-button {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #ffa500 0%, #ff6b00 100%);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            z-index: 99;
        }

        .shop-button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 165, 0, 0.6);
        }

        .shop-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #d32f2f;
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            animation: fadeInModal 0.3s ease;
        }

        @keyframes fadeInModal {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #1a1a1a;
            border: 2px solid #ffd700;
            border-radius: 15px;
            padding: 30px;
            max-width: 900px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.4);
            animation: slideInModal 0.3s ease;
        }

        @keyframes slideInModal {
            from { opacity: 0; transform: translateY(-50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #ffd700;
            padding-bottom: 15px;
        }

        .modal-header h2 {
            color: #ffd700;
            font-size: 28px;
        }

        .modal-close {
            background: none;
            border: none;
            color: #ffd700;
            font-size: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            transform: scale(1.2);
            color: #ff6b00;
        }

        .player-info {
            background: #252525;
            border: 2px solid #ffd700;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .player-stats {
            text-align: center;
        }

        .player-avatar {
            font-size: 60px;
            margin-bottom: 10px;
        }

        .stat-label {
            color: #87CEEB;
            font-size: 12px;
            font-weight: bold;
        }

        .stat-value {
            color: #FFD700;
            font-size: 24px;
            font-weight: bold;
        }

        .shop-section {
            margin-bottom: 30px;
        }

        .section-title {
            color: #ffa500;
            font-size: 20px;
            margin-bottom: 15px;
            border-bottom: 2px solid #ffa500;
            padding-bottom: 10px;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
        }

        .shop-item {
            background: #252525;
            border: 2px solid #444;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .shop-item:hover {
            border-color: #ffa500;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(255, 165, 0, 0.3);
        }

        .shop-item.purchased {
            border-color: #4caf50;
            background: #1a3a1a;
        }

        .shop-item.equipped {
            border-color: #FFD700;
            background: #2a2a0a;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }

        .item-emoji {
            font-size: 50px;
            margin-bottom: 10px;
            display: block;
        }

        .item-name {
            color: #87CEEB;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .item-price {
            color: #FFD700;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .item-btn {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 5px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-buy {
            background: linear-gradient(135deg, #ffa500 0%, #ff6b00 100%);
            color: white;
        }

        .btn-buy:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(255, 165, 0, 0.6);
        }

        .btn-buy:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-equipped {
            background: #4caf50;
            color: white;
        }

        .btn-equip {
            background: #2196F3;
            color: white;
        }

        .badge-new {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #d32f2f;
            color: white;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: bold;
        }

        .badge-anniversary {
            position: absolute;
            top: 5px;
            left: 5px;
            background: linear-gradient(45deg, #ffd700, #ff1493);
            color: #000;
            padding: 3px 6px;
            border-radius: 3px;
            font-size: 9px;
            font-weight: bold;
        }

        /* ===== CHAT GLOBAL ===== */
        .chat-container {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 350px;
            height: 400px;
            background: #1a1a1a;
            border: 2px solid #667eea;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            z-index: 98;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            border-radius: 8px 8px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
        }

        .chat-close-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            cursor: pointer;
            width: 25px;
            height: 25px;
            border-radius: 50%;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-message {
            background: #252525;
            padding: 8px 10px;
            border-radius: 6px;
            border-left: 3px solid #667eea;
        }

        .chat-message-username {
            color: #87CEEB;
            font-size: 11px;
            font-weight: bold;
        }

        .chat-message-text {
            color: #fff;
            font-size: 12px;
        }

        .chat-input-area {
            display: flex;
            gap: 8px;
            padding: 10px;
            background: #252525;
            border-top: 1px solid #667eea;
        }

        .chat-input {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #667eea;
            color: #fff;
            padding: 8px;
            border-radius: 5px;
            font-size: 12px;
        }

        .chat-send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            cursor: pointer;
            width: 35px;
            border-radius: 5px;
        }

        .chat-toggle-btn {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
            z-index: 98;
        }

        .chat-toggle-btn.hidden, .chat-container.hidden {
            display: none;
        }

        /* ===== ADMIN PANEL ===== */
        .admin-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
            z-index: 100;
        }

        .admin-panel {
            position: fixed;
            bottom: 80px;
            right: 20px;
            width: 320px;
            background: #1a1a1a;
            border: 2px solid #667eea;
            border-radius: 10px;
            padding: 15px;
            display: none;
            z-index: 101;
            max-height: 450px;
            overflow-y: auto;
        }

        .admin-panel.active { display: block; }

        .admin-panel h2 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 16px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 5px;
        }

        .config-group {
            margin-bottom: 10px;
            padding: 8px;
            background: #252525;
            border-radius: 5px;
        }

        .config-group label {
            display: block;
            color: #87CEEB;
            font-size: 11px;
            margin-bottom: 5px;
        }

        .config-group input {
            width: 100%;
            padding: 5px;
            background: #1a1a1a;
            border: 1px solid #667eea;
            color: #fff;
            border-radius: 3px;
        }

        .admin-btn {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .admin-btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }

        /* ===== PANTALLA DE INICIO ANIVERSARIO ===== */
        .start-screen {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #2b1055 0%, #7597de 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            text-align: center;
        }

        .start-screen.hidden { display: none; }

        .game-title {
            font-size: clamp(30px, 6vw, 60px);
            color: #ffd700;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8), 2px 2px #ff1493;
            margin-bottom: 10px;
        }

        .anniversary-tag {
            font-size: clamp(18px, 4vw, 32px);
            color: #ffffff;
            background: #ff1493;
            padding: 5px 15px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 0 10px #ff1493;
        }

        .game-coin {
            font-size: clamp(50px, 8vw, 80px);
            margin: 10px 0;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0%, 100% { transform: rotateY(0deg); }
            50% { transform: rotateY(180deg); }
        }

        .start-instruction {
            font-size: clamp(14px, 3vw, 20px);
            color: white;
            margin-top: 20px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div class="anniversary-banner">✨ ¡EDICIÓN ESPECIAL 1º ANIVERSARIO! ✨</div>

    <div class="start-screen" id="startScreen">
        <div class="game-title">🎮 ATRAPA LA MONEDA</div>
        <div class="anniversary-tag">🎂 ¡1ER ANIVERSARIO! 🎉</div>
        <div class="game-coin">🪙</div>
        <div class="start-instruction">Haz clic para comenzar</div>
    </div>
    <canvas id="gameCanvas"></canvas>
</div>

<button class="fullscreen-btn" id="fullscreenBtn" title="Pantalla Completa">⛶</button>

<button class="shop-button" id="shopBtn" title="Tienda">🛍️
    <div class="shop-badge" id="shopBadge">0</div>
</button>

<div class="modal" id="shopModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2>🛍️ Tienda de Aniversario</h2>
            <button class="modal-close" id="shopClose">✕</button>
        </div>

        <div class="player-info">
            <div class="player-stats">
                <div class="player-avatar" id="playerAvatar">🎂</div>
                <div class="stat-label">Avatar</div>
            </div>
            <div class="player-stats">
                <div class="stat-value" id="playerCoins">0</div>
                <div class="stat-label">Monedas</div>
            </div>
            <div class="player-stats">
                <div class="player-avatar" id="playerBasket">🎂</div>
                <div class="stat-label">Cesta</div>
            </div>
        </div>

        <div class="shop-section">
            <div class="section-title">👤 Avatares Especiales</div>
            <div class="items-grid" id="avatarsGrid"></div>
        </div>

        <div class="shop-section">
            <div class="section-title">🧺 Skins de Cesta</div>
            <div class="items-grid" id="skinsGrid"></div>
        </div>
    </div>
</div>

<button class="chat-toggle-btn hidden" id="chatToggleBtn">💬</button>
<div class="chat-container hidden" id="chatContainer">
    <div class="chat-header">
        <span>💬 Chat Global</span>
        <button class="chat-close-btn" id="chatCloseBtn">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-area">
        <input type="text" id="chatInput" class="chat-input" placeholder="Escribe un mensaje...">
        <button class="chat-send-btn" id="chatSendBtn">➤</button>
    </div>
</div>

<button class="admin-button" id="adminBtn" title="Panel Admin">⚙️</button>

<div class="admin-panel" id="adminPanel">
    <h2>⚙️ Panel de Control</h2>
    <div class="config-group">
        <label>⏱️ Tiempo Inicial (s)</label>
        <input type="number" id="initialTime" value="30">
    </div>
    <div class="config-group">
        <label>🎯 Velocidad Inicial Moneda</label>
        <input type="number" id="initialSpeed" value="4">
    </div>
    <div class="config-group">
        <label>💰 Puntos por Moneda</label>
        <input type="number" id="scorePerCoin" value="10">
    </div>
    <button class="admin-btn admin-btn-primary" id="applyBtn">✅ Aplicar</button>
</div>

<script>
    // ===== CONFIGURACIÓN DEL JUEGO =====
    const CONFIG = {
        INITIAL_TIME: 30,
        INITIAL_COIN_SPEED: 4,
        SPEED_INCREMENT: 0.2,
        SCORE_PER_COIN: 10,
        BASKET_WIDTH: 90,
        BASKET_HEIGHT: 20,
        COIN_RADIUS: 15
    };

    let coins = 100; // Regalo de Aniversario
    let equippedAvatar = 'avatar_anniv';
    let equippedSkin = 'skin_anniv';

    const SHOP_ITEMS = {
        avatars: [
            { id: 'avatar_anniv', name: '🎂 Cumpleañero', emoji: '🎂', price: 0, purchased: true, anniversary: true },
            { id: 'avatar1', name: '👤 Clásico', emoji: '👤', price: 0, purchased: true },
            { id: 'avatar2', name: '😎 Frío', emoji: '😎', price: 150 },
            { id: 'avatar3', name: '🤖 Robot', emoji: '🤖', price: 200 },
            { id: 'avatar4', name: '👑 Rey Aniversario', emoji: '👑', price: 1, popular: true },
            { id: 'avatar5', name: '🚀 Astronauta', emoji: '🚀', price: 350 }
        ],
        skins: [
            {
                id: 'skin_anniv',
                name: '🎉 Tarta 1º Año',
                price: 0,
                purchased: true,
                anniversary: true,
                draw: function(ctx, x, y, width, height) {
                    ctx.fillStyle = "#ff69b4";
                    ctx.fillRect(x, y, width, height);
                    ctx.fillStyle = "#ffffff";
                    ctx.fillRect(x, y - 5, width, 5);
                    ctx.fillStyle = "#ffd700";
                    ctx.fillRect(x + width/2 - 3, y - 12, 6, 7);
                }
            },
            { 
                id: 'skin1', 
                name: '🧺 Clásica', 
                price: 0, 
                purchased: true,
                draw: function(ctx, x, y, width, height) {
                    ctx.fillStyle = "#8B4513";
                    ctx.fillRect(x, y, width, height);
                    ctx.strokeStyle = "#5c2d0c";
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x, y, width, height);
                }
            },
            { 
                id: 'skin2', 
                name: '✨ Mágica', 
                price: 120,
                draw: function(ctx, x, y, width, height) {
                    const gradient = ctx.createLinearGradient(x, y, x + width, y);
                    gradient.addColorStop(0, '#FF1493');
                    gradient.addColorStop(0.5, '#00BFFF');
                    gradient.addColorStop(1, '#00FF7F');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(x, y, width, height);
                }
            },
            { 
                id: 'skin3', 
                name: '🔥 Fuego', 
                price: 200,
                draw: function(ctx, x, y, width, height) {
                    const gradient = ctx.createLinearGradient(x, y, x, y + height);
                    gradient.addColorStop(0, '#FFD700');
                    gradient.addColorStop(1, '#FF4500');
                    ctx.fillStyle = gradient;
                    ctx.fillRect(x, y, width, height);
                }
            },
            { 
                id: 'skin4', 
                name: '❄️ Hielo', 
                price: 180,
                draw: function(ctx, x, y, width, height) {
                    ctx.fillStyle = "#00CED1";
                    ctx.fillRect(x, y, width, height);
                    ctx.strokeStyle = "#87CEEB";
                    ctx.strokeRect(x, y, width, height);
                }
            }
        ]
    };

    // Canvas Setup
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Game Variables
    let gameActive = false;
    let score = 0;
    let timeLeft = CONFIG.INITIAL_TIME;
    let coinSpeed = CONFIG.INITIAL_COIN_SPEED;
    let basketX = canvas.width / 2 - CONFIG.BASKET_WIDTH / 2;
    let coinX = Math.random() * (canvas.width - 40) + 20;
    let coinY = -20;
    let particles = [];
    let confetti = [];
    let gameInterval, timerInterval;

    // Confetti para el 1º Aniversario
    function initConfetti() {
        confetti = [];
        for (let i = 0; i < 50; i++) {
            confetti.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                r: Math.random() * 6 + 2,
                d: Math.random() * 10,
                color: `hsl(${Math.random() * 360}, 100%, 50%)`,
                tilt: Math.random() * 10 - 10
            });
        }
    }

    function drawConfetti() {
        confetti.forEach((p) => {
            ctx.beginPath();
            ctx.lineWidth = p.r;
            ctx.strokeStyle = p.color;
            ctx.moveTo(p.x + p.tilt + p.r / 2, p.y);
            ctx.lineTo(p.x + p.tilt, p.y + p.tilt + p.r / 2);
            ctx.stroke();
            p.y += Math.cos(p.d) + 1 + p.r / 2;
            p.tilt = Math.sin(p.d) * 15;

            if (p.y > canvas.height) {
                p.y = -10;
                p.x = Math.random() * canvas.width;
            }
        });
    }

    // Input Control
    window.addEventListener('mousemove', (e) => {
        basketX = e.clientX - CONFIG.BASKET_WIDTH / 2;
    });

    window.addEventListener('touchmove', (e) => {
        if (e.touches.length > 0) {
            basketX = e.touches[0].clientX - CONFIG.BASKET_WIDTH / 2;
        }
    });

    // Start Game
    document.getElementById('startScreen').addEventListener('click', startGame);

    function startGame() {
        document.getElementById('startScreen').classList.add('hidden');
        gameActive = true;
        score = 0;
        timeLeft = CONFIG.INITIAL_TIME;
        coinSpeed = CONFIG.INITIAL_COIN_SPEED;
        coinY = -20;
        initConfetti();

        clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (gameActive) {
                timeLeft--;
                if (timeLeft <= 0) endGame();
            }
        }, 1000);

        requestAnimationFrame(updateGame);
    }

    function endGame() {
        gameActive = false;
        clearInterval(timerInterval);
        const startScreen = document.getElementById('startScreen');
        startScreen.querySelector('.start-instruction').innerText = `¡Tiempo agotado! Puntos: ${score}. Haz clic para volver a jugar.`;
        startScreen.classList.remove('hidden');
    }

    function updateGame() {
        if (!gameActive) return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Dibujar Confetti de Aniversario
        drawConfetti();

        // Mover Moneda
        coinY += coinSpeed;

        // Detectar Colisión
        const basketY = canvas.height - 80;
        if (
            coinY + CONFIG.COIN_RADIUS >= basketY &&
            coinY - CONFIG.COIN_RADIUS <= basketY + CONFIG.BASKET_HEIGHT &&
            coinX >= basketX &&
            coinX <= basketX + CONFIG.BASKET_WIDTH
        ) {
            score += CONFIG.SCORE_PER_COIN;
            coins += Math.floor(CONFIG.SCORE_PER_COIN / 2);
            coinSpeed += CONFIG.SPEED_INCREMENT;
            coinY = -20;
            coinX = Math.random() * (canvas.width - 40) + 20;
            updateShopUI();
        } else if (coinY > canvas.height) {
            coinY = -20;
            coinX = Math.random() * (canvas.width - 40) + 20;
        }

        // Dibujar Moneda
        ctx.beginPath();
        ctx.arc(coinX, coinY, CONFIG.COIN_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = "#FFD700";
        ctx.fill();
        ctx.strokeStyle = "#DAA520";
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.closePath();

        // Dibujar Cesta
        const currentSkin = SHOP_ITEMS.skins.find(s => s.id === equippedSkin) || SHOP_ITEMS.skins[0];
        currentSkin.draw(ctx, basketX, basketY, CONFIG.BASKET_WIDTH, CONFIG.BASKET_HEIGHT);

        // HUD / Texto
        ctx.fillStyle = "#ffffff";
        ctx.font = "20px 'Courier New'";
        ctx.fillText(`Puntos: ${score}`, 20, 40);
        ctx.fillText(`Tiempo: ${timeLeft}s`, 20, 70);

        requestAnimationFrame(updateGame);
    }

    // UI Shop Logic
    const shopModal = document.getElementById('shopModal');
    document.getElementById('shopBtn').addEventListener('click', () => {
        updateShopUI();
        shopModal.classList.add('active');
    });

    document.getElementById('shopClose').addEventListener('click', () => {
        shopModal.classList.remove('active');
    });

    function updateShopUI() {
        document.getElementById('playerCoins').innerText = coins;
        
        // Avatares
        const avatarsGrid = document.getElementById('avatarsGrid');
        avatarsGrid.innerHTML = '';
        SHOP_ITEMS.avatars.forEach(item => {
            const div = document.createElement('div');
            div.className = `shop-item ${item.purchased ? 'purchased' : ''} ${equippedAvatar === item.id ? 'equipped' : ''}`;
            div.innerHTML = `
                ${item.anniversary ? '<span class="badge-anniversary">1º AÑO</span>' : ''}
                <span class="item-emoji">${item.emoji}</span>
                <div class="item-name">${item.name}</div>
                <div class="item-price">${item.purchased ? 'Obtenido' : item.price + ' 🪙'}</div>
                <button class="item-btn ${equippedAvatar === item.id ? 'btn-equipped' : 'btn-buy'}" onclick="selectAvatar('${item.id}')">
                    ${equippedAvatar === item.id ? 'Equipado' : item.purchased ? 'Equipar' : 'Comprar'}
                </button>
            `;
            avatarsGrid.appendChild(div);
        });

        // Skins
        const skinsGrid = document.getElementById('skinsGrid');
        skinsGrid.innerHTML = '';
        SHOP_ITEMS.skins.forEach(item => {
            const div = document.createElement('div');
            div.className = `shop-item ${item.purchased ? 'purchased' : ''} ${equippedSkin === item.id ? 'equipped' : ''}`;
            div.innerHTML = `
                ${item.anniversary ? '<span class="badge-anniversary">1º AÑO</span>' : ''}
                <span class="item-emoji">🧺</span>
                <div class="item-name">${item.name}</div>
                <div class="item-price">${item.purchased ? 'Obtenida' : item.price + ' 🪙'}</div>
                <button class="item-btn ${equippedSkin === item.id ? 'btn-equipped' : 'btn-buy'}" onclick="selectSkin('${item.id}')">
                    ${equippedSkin === item.id ? 'Equipada' : item.purchased ? 'Equipar' : 'Comprar'}
                </button>
            `;
            skinsGrid.appendChild(div);
        });
    }

    window.selectAvatar = function(id) {
        const item = SHOP_ITEMS.avatars.find(a => a.id === id);
        if (!item.purchased) {
            if (coins >= item.price) {
                coins -= item.price;
                item.purchased = true;
                equippedAvatar = id;
            }
        } else {
            equippedAvatar = id;
        }
        document.getElementById('playerAvatar').innerText = item.emoji;
        updateShopUI();
    };

    window.selectSkin = function(id) {
        const item = SHOP_ITEMS.skins.find(s => s.id === id);
        if (!item.purchased) {
            if (coins >= item.price) {
                coins -= item.price;
                item.purchased = true;
                equippedSkin = id;
            }
        } else {
            equippedSkin = id;
        }
        updateShopUI();
    };

    // Fullscreen Toggle
    document.getElementById('fullscreenBtn').addEventListener('click', () => {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            document.exitFullscreen();
        }
    });

    // Admin Panel
    const adminPanel = document.getElementById('adminPanel');
    document.getElementById('adminBtn').addEventListener('click', () => {
        adminPanel.classList.toggle('active');
    });

    document.getElementById('applyBtn').addEventListener('click', () => {
        CONFIG.INITIAL_TIME = parseInt(document.getElementById('initialTime').value) || 30;
        CONFIG.INITIAL_COIN_SPEED = parseFloat(document.getElementById('initialSpeed').value) || 4;
        CONFIG.SCORE_PER_COIN = parseInt(document.getElementById('scorePerCoin').value) || 10;
        adminPanel.classList.remove('active');
    });
</script>
</body>
</html>
