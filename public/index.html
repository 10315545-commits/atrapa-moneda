<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Atrapa la Moneda — Global Shop</title>
  <style>
    :root {
      --bg:#090d18;
      --panel:#121827;
      --panel2:#181f2f;
      --gold:#ffd166;
      --pink:#ff4fd8;
      --cyan:#38d9ff;
      --text:#f5f7ff;
      --muted:#b0bdd9;
      --danger:#ff5f5f;
      --green:#49b65c;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: 'Courier New', Courier, monospace;
      background:
        radial-gradient(circle at top, rgba(255,79,216,.18), transparent 25%),
        radial-gradient(circle at bottom, rgba(56,217,255,.12), transparent 30%),
        linear-gradient(160deg, #090d18, #180d22);
      color: var(--text);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .app {
      width: min(1200px, 100%);
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 20px;
    }

    .panel {
      background: rgba(18, 24, 39, 0.94);
      border: 1px solid rgba(255, 209, 102, 0.45);
      border-radius: 18px;
      box-shadow: 0 16px 38px rgba(0,0,0,.32);
      overflow: hidden;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px 18px;
      background: linear-gradient(90deg, rgba(255,209,102,.18), rgba(255,79,216,.12), rgba(56,217,255,.12));
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .brand {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 900;
      letter-spacing: .05em;
    }

    .user-pill {
      background: rgba(255,209,102,.12);
      color: var(--gold);
      border: 1px solid rgba(255,209,102,.5);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
    }

    .content {
      padding: 18px;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat {
      flex: 1;
      background: rgba(255,255,255,.02);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .stat-label {
      display: block;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 1.4rem;
      font-weight: 900;
      color: var(--gold);
    }

    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
    }

    .item {
      background: linear-gradient(180deg, rgba(28,34,52,.95), rgba(18,22,32,.95));
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
      padding: 12px 10px;
      text-align: center;
      transition: transform .15s ease, border-color .15s ease;
    }

    .item:hover {
      transform: translateY(-2px);
      border-color: rgba(255,209,102,.5);
    }

    .item-emoji {
      display: block;
      font-size: 2rem;
      margin-bottom: 6px;
    }

    .item-name {
      display: block;
      min-height: 32px;
      font-size: 11px;
      color: #a9d9ff;
      margin-bottom: 8px;
      font-weight: 700;
    }

    .buy-btn {
      width: 100%;
      border: none;
      border-radius: 9px;
      padding: 9px 8px;
      background: linear-gradient(135deg, #ff8a3d, #ff5f5f);
      color: white;
      cursor: pointer;
      font-size: 11px;
      font-weight: 900;
    }

    .buy-btn.equipped {
      background: linear-gradient(135deg, #49b65c, #2db777);
    }

    .chat-box {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .chat-messages {
      height: 420px;
      overflow-y: auto;
      padding: 12px 14px;
      background: rgba(0,0,0,.08);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.06);
      margin-bottom: 12px;
    }

    .chat-msg {
      padding: 7px 8px;
      border-left: 3px solid rgba(56,217,255,.8);
      background: rgba(34,41,58,.8);
      margin-bottom: 8px;
      border-radius: 8px;
    }

    .chat-msg.system {
      border-left-color: rgba(255,209,102,.9);
      background: rgba(59,45,9,.75);
    }

    .chat-user {
      display: block;
      color: #92d8ff;
      font-size: 10px;
      font-weight: 900;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .chat-text {
      font-size: 12px;
      line-height: 1.4;
      color: white;
      word-break: break-word;
    }

    .composer {
      display: flex;
      gap: 8px;
    }

    .composer input {
      flex: 1;
      border: 1px solid rgba(56,217,255,.6);
      border-radius: 10px;
      background: #0b1019;
      color: white;
      padding: 11px 12px;
      font-size: 12px;
      outline: none;
    }

    .composer button {
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #2cdfff, #0f71ff);
      color: white;
      font-weight: 900;
      padding: 0 16px;
      cursor: pointer;
    }

    .login-box {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .login-box input {
      flex: 1;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.02);
      color: white;
      border-radius: 10px;
      padding: 12px;
      outline: none;
    }

    .login-box button {
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #ffd166, #ff4fd8, #38d9ff);
      color: #0c1120;
      font-weight: 900;
      padding: 12px 18px;
      cursor: pointer;
    }

    .hidden { display: none; }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }

      .chat-messages {
        height: 260px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <section class="panel">
      <div class="header">
        <h1 class="brand">🛍️ TIENDA GLOBAL</h1>
        <div id="userPill" class="user-pill">Sin usuario</div>
      </div>

      <div class="content">
        <div id="loginWrap" class="login-box">
          <input id="usernameInput" type="text" maxlength="18" placeholder="Tu nombre" />
          <button id="loginBtn">Entrar</button>
        </div>

        <div id="shopWrap" class="hidden">
          <div class="stats">
            <div class="stat">
              <span class="stat-label">Monedas</span>
              <span id="coinsValue" class="stat-value">0</span>
            </div>
            <div class="stat">
              <span class="stat-label">Avatar</span>
              <span id="avatarValue" class="stat-value">🎂</span>
            </div>
            <div class="stat">
              <span class="stat-label">Skin</span>
              <span id="skinValue" class="stat-value">🧺</span>
            </div>
          </div>

          <div id="shopGrid" class="shop-grid"></div>
        </div>
      </div>
    </section>

    <aside class="panel">
      <div class="header">
        <h2 class="brand">💬 CHAT GLOBAL</h2>
      </div>

      <div class="content chat-box">
        <div id="messages" class="chat-messages"></div>
        <div class="composer">
          <input id="chatInput" type="text" maxlength="180" placeholder="Escribe tu mensaje..." />
          <button id="sendBtn">Enviar</button>
        </div>
      </div>
    </aside>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();

    const state = {
      me: null,
      shop: [],
      chat: []
    };

    const loginWrap = document.getElementById('loginWrap');
    const shopWrap = document.getElementById('shopWrap');
    const userPill = document.getElementById('userPill');
    const coinsValue = document.getElementById('coinsValue');
    const avatarValue = document.getElementById('avatarValue');
    const skinValue = document.getElementById('skinValue');
    const shopGrid = document.getElementById('shopGrid');
    const messages = document.getElementById('messages');

    function renderState() {
      if (!state.me) return;

      userPill.textContent = state.me.username;
      coinsValue.textContent = state.me.coins;
      avatarValue.textContent = getEmojiById(state.me.avatar) || '🎂';
      skinValue.textContent = getEmojiById(state.me.skin) || '🧺';

      shopGrid.innerHTML = '';
      for (const item of state.shop) {
        const owned = state.me.inventory.includes(item.id);
        const equipped = item.id === state.me.avatar || item.id === state.me.skin || item.id === state.me.coinSkin || item.id === state.me.trail;

        const card = document.createElement('div');
        card.className = 'item';

        card.innerHTML = `
          <span class="item-emoji">${item.emoji}</span>
          <span class="item-name">${item.name}</span>
          <button class="buy-btn ${equipped ? 'equipped' : ''}">${owned ? (equipped ? 'Equipado' : 'Usar') : `Comprar · ${item.price}`}</button>
        `;

        card.querySelector('button').addEventListener('click', () => {
          socket.emit('shop:buy', { itemId: item.id });
        });

        shopGrid.appendChild(card);
      }
    }

    function renderChat() {
      messages.innerHTML = '';
      for (const msg of state.chat) {
        const item = document.createElement('div');
        item.className = `chat-msg ${msg.system ? 'system' : ''}`;
        item.innerHTML = `
          <span class="chat-user">${msg.username}</span>
          <div class="chat-text">${msg.text}</div>
        `;
        messages.appendChild(item);
      }
      messages.scrollTop = messages.scrollHeight;
    }

    function getEmojiById(id) {
      const item = state.shop.find(x => x.id === id);
      return item ? item.emoji : null;
    }

    document.getElementById('loginBtn').addEventListener('click', () => {
      const username = document.getElementById('usernameInput').value.trim() || 'Jugador';
      socket.emit('register', { username });
    });

    document.getElementById('sendBtn').addEventListener('click', () => {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;
      socket.emit('chat:send', { text });
      input.value = '';
    });

    document.getElementById('chatInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        document.getElementById('sendBtn').click();
      }
    });

    socket.on('state', ({ me, shop, chat }) => {
      state.me = me;
      state.shop = shop;
      state.chat = chat;
      loginWrap.classList.add('hidden');
      shopWrap.classList.remove('hidden');
      renderState();
      renderChat();
    });

    socket.on('shop:updated', ({ me }) => {
      state.me = me;
      renderState();
    });

    socket.on('chat:new', (msg) => {
      state.chat.push(msg);
      if (state.chat.length > 80) state.chat.shift();
      renderChat();
    });

    socket.on('shop:error', ({ message }) => {
      alert(message);
    });
  </script>
</body>
</html>
